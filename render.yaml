services:
  - type: web
    name: rijan-portfolio
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: IP_HASH_SALT
        sync: false
      - key: ADMIN_PANEL_USER
        generateValue: true
      - key: ADMIN_PANEL_PASSWORD
        generateValue: true
      - key: CONTACT_TO_EMAIL
        value: business.rijan.np@gmail.com